[project]
name = "trailmate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atharva-phadtare-iterforge", email = "atharva.phadtare@iterforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "litellm[proxy]>=1.99.0",
    "pgvector>=0.5.0",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.362",
    "psycopg[binary]>=3.3.5",
    "pydantic>=2.13.4",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
trailmate = "trailmate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
