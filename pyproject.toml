[project]
name = "trailmate"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "atharva-phadtare-iterforge", email = "atharva.phadtare@iterforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "pydantic>=2.13.4",
    "uvicorn>=0.52.4",
]

[project.scripts]
trailmate = "trailmate:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
